# Branding
name: "Open Source Office Hours"
tagline: "One open-source project. Three levels of difficulty. Every week."
description: >-
  A weekly deep dive into notable open-source projects,
  explained at three levels of difficulty.

# GCP infrastructure
gcp_project: open-source-office-hours-pod
gcp_region: us-central1
secret_name: environment-variables
topic: open-source-office-hours-podcast-trigger
scheduler_job: open-source-office-hours-podcast-weekly
schedule: "0 7 * * MON"
timezone: America/Los_Angeles

# URLs & email
site_url: https://open-source-office-hours-podcast.alanch.am
from_email: no-reply@mail.open-source-office-hours-podcast.alanch.am

# Podcast
podcast_bucket: open-source-office-hours-podcast
podcast_cover_url: https://storage.googleapis.com/open-source-office-hours-podcast/cover.png
podcast_category: Technology
podcast_description: >-
  Each week, an AI agent researches a notable open-source project and
  produces a structured technical report at beginner, intermediate, and
  advanced levels. This podcast is the audio version of that report.
